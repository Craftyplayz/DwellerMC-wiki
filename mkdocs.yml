site_name: DwellerMC Wiki
site_url: https://craftyplayz.github.io/DwellerMC-wiki/
repo_url: https://github.com/Craftyplayz/DwellerMC-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  # Theme options: see README.md. Swap palette/font here.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle: { icon: material/brightness-4, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_javascript:
  - javascripts/dweller.js
extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - World:
      - Layout: world/layout.md
      - Depth & area level: world/depth.md
      - Spawning & respawning: world/spawning.md
      - The Surface: world/surface.md
      - Ores: world/ores.md
      - Structures: world/structures.md
      - Cave biomes:
          - world/biomes/index.md
          - Caves: world/biomes/caves.md
          - Sandstone Caves: world/biomes/sandstone-caves.md
          - Lush Caves: world/biomes/lush-caves.md
          - Dripstone Caves: world/biomes/dripstone-caves.md
          - Sulfur Caves: world/biomes/sulfur-caves.md
          - Deep Dark: world/biomes/deep-dark.md
  - Mobs:
      - Mob levels: mobs/levels.md
      - Mob gear: mobs/gear.md
      - Mob abilities: mobs/abilities.md
      - Tougher spawns: mobs/spawn-mix.md
      - Elite mobs: mobs/elites.md
      - Kill rewards: mobs/rewards.md
  - Server features:
      - Getting around:
          - Commands and spawn: plugins/essentials.md
          - Elevators: plugins/v-elevator.md
          - Protected areas: plugins/worldguard.md
      - Mining:
          - Veinmine: plugins/veinminer.md
          - Crafty Tools: plugins/craftytools.md
          - PickupBot: plugins/pickupbot.md
      - Fun & building:
          - Brewing: plugins/breweryx.md
          - Vaults: plugins/vaults.md
          - Vertical slabs: plugins/vertical-slabs.md
          - Name colors: plugins/namecolor.md
          - Disguises: plugins/disguises.md
          - NPCs: plugins/npcs.md
      - Community:
          - Discord: plugins/discord.md
          - Tab list: plugins/tab-list.md
          - Stats: plugins/stats.md
          - Chat reporting: plugins/chat-reporting.md
